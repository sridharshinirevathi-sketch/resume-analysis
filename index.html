<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Resume Match</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script><script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
.resume-details{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:23px}.resume-sections{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.resume-section{min-width:0}.resume-section h3{font-size:15px;margin-bottom:9px}.resume-section p{white-space:pre-line;overflow-wrap:anywhere;color:var(--muted);font-size:13px;margin:0}.resume-section .empty{font-size:13px}@media(max-width:720px){.resume-sections{grid-template-columns:1fr}}
</style></head><body><div id="root"></div>
<script type="text/babel">
const {useState}=React;const SKILLS=["Python","Java","JavaScript","TypeScript","C++","C#","SQL","HTML","CSS","React","Angular","Vue","Node.js","Django","Flask","FastAPI","Spring Boot","Pandas","NumPy","Scikit-learn","TensorFlow","PyTorch","Machine Learning","Deep Learning","Data Analysis","Power BI","Tableau","Excel","AWS","Azure","GCP","Docker","Kubernetes","Git","Linux","MongoDB","PostgreSQL","MySQL","REST API","GraphQL","Spark","Hadoop","Airflow","CI/CD","Selenium","Figma","Agile","Jira"];
function norm(t){return t.toLowerCase().replace(/[^a-z0-9+#.\-/\s]/g," ").replace(/\s+/g," ").trim()}function found(t){let x=norm(t);return SKILLS.filter(s=>new RegExp("(^|[^a-z0-9])"+s.toLowerCase().replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"(?=$|[^a-z0-9])").test(x))}function sim(a,b){let x=norm(a).split(" ").filter(w=>w.length>2),y=norm(b).split(" ").filter(w=>w.length>2),all=[...new Set([...x,...y])];let f=(z,w)=>z.filter(v=>v===w).length/z.length;let av=all.map(w=>f(x,w)),bv=all.map(w=>f(y,w)),d=av.reduce((s,v,i)=>s+v*bv[i],0),m=Math.sqrt(av.reduce((s,v)=>s+v*v,0))*Math.sqrt(bv.reduce((s,v)=>s+v*v,0));return m?d/m:0}
function extractResumeSections(text){const labels={education:/^(education|academic background|educational background|qualification|qualifications)\s*[:\-]?$/i,internships:/^(internships?|work experience|professional experience|experience)\s*[:\-]?$/i,certifications:/^(certifications?|licenses? and certifications|certificates|courses and certifications)\s*[:\-]?$/i};const sections={education:[],internships:[],certifications:[]};let current=null;text.split(/\r?\n/).forEach(line=>{const value=line.trim();if(!value)return;let key=Object.keys(labels).find(k=>labels[k].test(value));if(key){current=key;return}if(/^(projects?|skills|summary|objective|contact|achievements?|languages|references|technical skills)\s*[:\-]?$/i.test(value)){current=null;return}if(current)sections[current].push(value)});return sections}
function Tags({list,miss}){return list.length?<div className="tags">{list.map(x=><span className={'tag '+(miss?'missing':'')} key={x}>{x}</span>)}</div>:<p className="empty">{miss?'No skill gaps found in the catalog.':'No catalogued matches found yet.'}</p>}
function App(){const[r,setR]=useState(''),[j,setJ]=useState(''),[file,setFile]=useState(''),[msg,setMsg]=useState('Your files stay in this browser.'),[drag,setDrag]=useState(false),[res,setRes]=useState(null),[loading,setLoading]=useState(false);const changeResume=v=>{setR(v);setRes(null)};const changeJob=v=>{setJ(v);setRes(null)};async function pdf(f){if(!f)return;if(f.type!=='application/pdf'){setMsg('Please choose a PDF resume file.');return}setLoading(true);setFile('Reading '+f.name+'...');try{let p=await pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise,out=[];for(let i=1;i<=p.numPages;i++){let c=await(await p.getPage(i)).getTextContent();out.push(c.items.map(q=>q.str+(q.hasEOL?'\n':' ')).join(''))}changeResume(out.join('\n'));setFile(f.name+' loaded');setMsg('Resume ready for analysis.')}catch(e){setFile('Could not read this PDF.');setMsg('Try pasting the resume text instead.')}setLoading(false)}function run(){if(!r.trim()||!j.trim()){setMsg('Add both your resume and the job description to continue.');return}let rs=found(r),js=found(j),match=js.filter(x=>rs.includes(x)),miss=js.filter(x=>!rs.includes(x)),coverage=js.length?match.length/js.length:sim(r,j),score=Math.round(coverage*100),cat=score>=70?'High Match':score>=40?'Medium Match':'Low Match';setRes({score,cat,match,miss,total:js.length});setTimeout(()=>document.getElementById('results').scrollIntoView({behavior:'smooth'}),50)}function sample(){changeResume('Python developer with Machine Learning, SQL, Pandas, data analysis and Git experience.');changeJob('Python, Machine Learning, SQL, Pandas, and Scikit-learn required. Experience with Docker and AWS is preferred.');setMsg('Sample resume and job description loaded.')}let words=j.trim()?j.trim().split(/\s+/).length:0;return <><header className="top"><div className="brand"><span className="mark">R</span>Resume Match</div><span className="local">Local analysis</span></header><main><section className="intro"><p className="eyebrow">NLP resume analysis</p><h1>See how your resume fits the role.</h1><p>Compare skills, surface gaps, and get a clear match score before you apply.</p></section><section className="grid"><article className="card"><div className="head"><span className="icon">R</span><div><h2>Your resume</h2><p>Upload a PDF or paste the content.</p></div></div><label className={'drop '+(drag?'drag':'')} onDragOver={e=>{e.preventDefault();setDrag(true)}} onDragLeave={()=>setDrag(false)} onDrop={e=>{e.preventDefault();setDrag(false);pdf(e.dataTransfer.files[0])}}><span className="up">^</span><b>Drop your resume PDF here</b><span>or click to browse</span><input type="file" accept="application/pdf" onChange={e=>pdf(e.target.files[0])}/></label><p className="filename">{file}</p><div className="divide">or paste text</div><textarea value={r} onChange={e=>changeResume(e.target.value)} placeholder="Paste your resume content here..."/></article><article className="card"><div className="head"><span className="icon job">J</span><div><h2>Job description</h2><p>Paste the complete role requirements.</p></div></div><textarea className="jobarea" value={j} onChange={e=>changeJob(e.target.value)} placeholder="Paste the job description here..."/><div className="smallrow"><button className="linkbtn" onClick={sample}>Try sample data</button><span>{words} words</span></div></article></section>{r.trim()&&(()=>{const details=extractResumeSections(r);return <section className="resume-details"><div className="head"><span className="icon">+</span><div><h2>Resume details</h2><p>Education, internships, and certifications found in your resume.</p></div></div><div className="resume-sections">{[["Education",details.education],["Internships",details.internships],["Certifications",details.certifications]].map(([title,items])=><article className="resume-section" key={title}><h3>{title}</h3>{items.length?<p>{items.join("\n")}</p>:<p className="empty">No details detected.</p>}</article>)}</div></section>})()}<div className="actions"><p className="hint">{msg}</p><button className="analyze" disabled={loading} onClick={run}>{loading?'Reading PDF...':'Analyze match'}</button></div>{res&&<section id="results" className="results"><div className="resulthead"><div><p className="eyebrow">Analysis result</p><h2>Your job match</h2></div><button className="reset" onClick={()=>setRes(null)}>Reset</button></div><div className="stats"><article className="stat primary"><p>Match score</p><div className="score">{res.score}<small>%</small></div><div className="meter"><span style={{width:res.score+'%'}}/></div><p className="detail">{res.score>=70?'Strong alignment with this role.':res.score>=40?'There is a solid foundation to build on.':'Add relevant evidence before applying.'}</p></article><article className="stat"><p>Match category</p><strong className={res.cat.split(' ')[0].toLowerCase()}>{res.cat}</strong><p className="detail">Based on role relevance and skill coverage</p></article><article className="stat"><p>Required skills covered</p><strong>{res.match.length} / {res.total}</strong><p className="detail">Skills identified in the job description</p></article></div><div className="skillgrid"><article className="skillcard"><div className="skillhead"><span className="badge">+</span><h3>Matched skills</h3><span className="count">{res.match.length}</span></div><Tags list={res.match}/></article><article className="skillcard"><div className="skillhead"><span className="badge warn">+</span><h3>Skills to build</h3><span className="count">{res.miss.length}</span></div><Tags list={res.miss} miss/></article><article className="recommend"><span className="bulb">!</span><p className="eyebrow">Recommendation</p><h3>{res.miss.length?'Prioritize '+res.miss.slice(0,2).join(' and ')+'.':'Your listed skills align well.'}</h3><p>{res.miss.length?'Strengthen your application by learning or showing evidence of '+res.miss.slice(0,3).join(', ')+'. Add projects, certificates, or measurable experience where appropriate.':'Tailor your resume with measurable outcomes and role-specific project highlights to make this match even stronger.'}</p></article></div></section>}</main></>};ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>

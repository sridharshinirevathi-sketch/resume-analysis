<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Resume Match</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script><script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root{--ink:#18262d;--muted:#627178;--line:#d9e2e5;--bg:#f4f7f7;--teal:#087c77;--tealsoft:#e3f3f1;--orange:#d96944;--gold:#9d6817}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Arial,sans-serif}button,textarea,input{font:inherit}.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(24px,calc((100% - 1160px)/2))}.brand{font-size:19px;font-weight:bold;display:flex;align-items:center;gap:10px}.mark{width:31px;height:31px;border-radius:7px;background:var(--teal);color:#fff;display:grid;place-items:center}.local{font-size:13px;color:var(--muted)}.local:before{content:"";display:inline-block;width:7px;height:7px;background:#27966b;border-radius:50%;margin-right:7px}main{max-width:1160px;margin:auto;padding:50px 24px 72px}.intro{max-width:650px;margin-bottom:30px}.eyebrow{margin:0 0 7px;color:var(--teal);text-transform:uppercase;font-size:11px;letter-spacing:1px;font-weight:bold}.intro h1{font-size:39px;line-height:1.12;margin:0 0 10px}.intro p:last-child{margin:0;color:var(--muted);font-size:17px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:23px}.head{display:flex;gap:12px;align-items:center;margin-bottom:19px}.icon{width:39px;height:39px;border-radius:7px;display:grid;place-items:center;background:var(--tealsoft);color:var(--teal);font-weight:bold}.icon.job{background:#fbeae4;color:var(--orange)}h2,h3{margin:0}.head h2{font-size:18px}.head p{margin:2px 0 0;color:var(--muted);font-size:13px}.drop{min-height:122px;border:1.5px dashed #a8bbc0;background:#f9fbfb;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;text-align:center;color:var(--muted)}.drop.drag,.drop:hover{border-color:var(--teal);background:var(--tealsoft)}.drop b{color:var(--ink);font-size:14px}.drop input{display:none}.up{font-size:24px;color:var(--teal)}.filename{height:18px;margin:8px 0 0;color:var(--teal);font-size:12px}.divide{display:flex;align-items:center;gap:9px;margin:10px 0;color:#98a4aa;font-size:12px}.divide:before,.divide:after{content:"";height:1px;flex:1;background:var(--line)}textarea{width:100%;height:120px;resize:vertical;padding:12px;border:1px solid var(--line);border-radius:5px;outline:0;color:var(--ink)}textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px var(--tealsoft)}.jobarea{height:220px}.smallrow,.actions,.resulthead,.skillhead{display:flex;justify-content:space-between;align-items:center}.smallrow{font-size:12px;color:var(--muted);margin-top:9px}.linkbtn{border:0;background:none;color:var(--teal);font-size:12px;font-weight:bold;padding:0;cursor:pointer}.actions{margin:22px 0 40px}.hint{margin:0;color:var(--muted);font-size:13px}.analyze{border:0;border-radius:6px;background:var(--teal);color:#fff;padding:12px 18px;font-weight:bold;cursor:pointer}.analyze:disabled{opacity:.65}.results{border-top:1px solid var(--line);padding-top:32px}.resulthead{margin-bottom:18px}.resulthead h2{font-size:25px}.reset{width:36px;height:36px;background:#fff;border:1px solid var(--line);border-radius:5px;color:var(--muted);cursor:pointer}.stats{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:18px}.stat{min-height:160px;padding:20px;background:#fff;border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column}.stat.primary{background:#f8fbfb;border-color:#cce5e3}.stat p{margin:0 0 8px;color:var(--muted);font-size:13px}.score{font-size:43px;line-height:1;margin:5px 0 16px;color:var(--teal);font-weight:bold}.score small{font-size:20px}.meter{height:7px;background:#d9e8e7;border-radius:9px;overflow:hidden}.meter span{display:block;height:100%;background:var(--teal);transition:.7s}.detail{margin-top:auto!important;font-size:12px!important}.stat strong{font-size:25px;margin-top:8px}.high{color:var(--teal)}.medium{color:var(--gold)}.low{color:var(--orange)}.skillgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.skillcard,.recommend{min-height:164px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:20px}.skillhead{justify-content:flex-start;gap:8px;margin-bottom:16px}.badge{width:23px;height:23px;display:grid;place-items:center;border-radius:50%;background:#e3f5ec;color:#147a52}.badge.warn{background:#fff2da;color:var(--gold)}.count{margin-left:auto;background:#edf0f2;color:var(--muted);border-radius:12px;padding:1px 7px;font-size:12px}.tags{display:flex;flex-wrap:wrap;gap:7px}.tag{padding:5px 9px;border-radius:4px;background:#edf7f5;color:#146763;font-size:13px;font-weight:bold}.tag.missing{background:#fff2df;color:#96620f}.empty{color:var(--muted);font-size:13px;margin:4px 0}.recommend{grid-column:span 2;background:#fffdf8;padding-left:65px;position:relative}.bulb{position:absolute;left:20px;top:21px;color:var(--gold);font-size:23px}.recommend p:last-child{margin:5px 0 0;color:var(--muted)}@media(max-width:720px){main{padding:32px 16px 48px}.top{padding:0 16px}.intro h1{font-size:31px}.grid,.stats,.skillgrid{grid-template-columns:1fr}.recommend{grid-column:auto}.jobarea{height:180px}.hint{max-width:155px}}
</style></head><body><div id="root"></div>
<script type="text/babel">
const {useState}=React;const SKILLS=["Python","Java","JavaScript","TypeScript","C++","C#","SQL","HTML","CSS","React","Angular","Vue","Node.js","Django","Flask","FastAPI","Spring Boot","Pandas","NumPy","Scikit-learn","TensorFlow","PyTorch","Machine Learning","Deep Learning","Data Analysis","Power BI","Tableau","Excel","AWS","Azure","GCP","Docker","Kubernetes","Git","Linux","MongoDB","PostgreSQL","MySQL","REST API","GraphQL","Spark","Hadoop","Airflow","CI/CD","Selenium","Figma","Agile","Jira"];
function norm(t){return t.toLowerCase().replace(/[^a-z0-9+#.\-/\s]/g," ").replace(/\s+/g," ").trim()}function found(t){let x=norm(t);return SKILLS.filter(s=>new RegExp("(^|[^a-z0-9])"+s.toLowerCase().replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"(?=$|[^a-z0-9])").test(x))}function sim(a,b){let x=norm(a).split(" ").filter(w=>w.length>2),y=norm(b).split(" ").filter(w=>w.length>2),all=[...new Set([...x,...y])];let f=(z,w)=>z.filter(v=>v===w).length/z.length;let av=all.map(w=>f(x,w)),bv=all.map(w=>f(y,w)),d=av.reduce((s,v,i)=>s+v*bv[i],0),m=Math.sqrt(av.reduce((s,v)=>s+v*v,0))*Math.sqrt(bv.reduce((s,v)=>s+v*v,0));return m?d/m:0}function Tags({list,miss}){return list.length?<div className="tags">{list.map(x=><span className={'tag '+(miss?'missing':'')} key={x}>{x}</span>)}</div>:<p className="empty">{miss?'No skill gaps found in the catalog.':'No catalogued matches found yet.'}</p>}
function App(){const[r,setR]=useState(''),[j,setJ]=useState(''),[file,setFile]=useState(''),[msg,setMsg]=useState('Your files stay in this browser.'),[drag,setDrag]=useState(false),[res,setRes]=useState(null),[loading,setLoading]=useState(false);const changeResume=v=>{setR(v);setRes(null)};const changeJob=v=>{setJ(v);setRes(null)};async function pdf(f){if(!f)return;if(f.type!=='application/pdf'){setMsg('Please choose a PDF resume file.');return}setLoading(true);setFile('Reading '+f.name+'...');try{let p=await pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise,out=[];for(let i=1;i<=p.numPages;i++){let c=await(await p.getPage(i)).getTextContent();out.push(c.items.map(q=>q.str).join(' '))}changeResume(out.join('\n'));setFile(f.name+' loaded');setMsg('Resume ready for analysis.')}catch(e){setFile('Could not read this PDF.');setMsg('Try pasting the resume text instead.')}setLoading(false)}function run(){if(!r.trim()||!j.trim()){setMsg('Add both your resume and the job description to continue.');return}let rs=found(r),js=found(j),match=js.filter(x=>rs.includes(x)),miss=js.filter(x=>!rs.includes(x)),coverage=js.length?match.length/js.length:sim(r,j),score=Math.round(coverage*100),cat=score>=70?'High Match':score>=40?'Medium Match':'Low Match';setRes({score,cat,match,miss,total:js.length});setTimeout(()=>document.getElementById('results').scrollIntoView({behavior:'smooth'}),50)}function sample(){changeResume('Python developer with Machine Learning, SQL, Pandas, data analysis and Git experience.');changeJob('Python, Machine Learning, SQL, Pandas, and Scikit-learn required. Experience with Docker and AWS is preferred.');setMsg('Sample resume and job description loaded.')}let words=j.trim()?j.trim().split(/\s+/).length:0;return <><header className="top"><div className="brand"><span className="mark">R</span>Resume Match</div><span className="local">Local analysis</span></header><main><section className="intro"><p className="eyebrow">NLP resume analysis</p><h1>See how your resume fits the role.</h1><p>Compare skills, surface gaps, and get a clear match score before you apply.</p></section><section className="grid"><article className="card"><div className="head"><span className="icon">R</span><div><h2>Your resume</h2><p>Upload a PDF or paste the content.</p></div></div><label className={'drop '+(drag?'drag':'')} onDragOver={e=>{e.preventDefault();setDrag(true)}} onDragLeave={()=>setDrag(false)} onDrop={e=>{e.preventDefault();setDrag(false);pdf(e.dataTransfer.files[0])}}><span className="up">^</span><b>Drop your resume PDF here</b><span>or click to browse</span><input type="file" accept="application/pdf" onChange={e=>pdf(e.target.files[0])}/></label><p className="filename">{file}</p><div className="divide">or paste text</div><textarea value={r} onChange={e=>changeResume(e.target.value)} placeholder="Paste your resume content here..."/></article><article className="card"><div className="head"><span className="icon job">J</span><div><h2>Job description</h2><p>Paste the complete role requirements.</p></div></div><textarea className="jobarea" value={j} onChange={e=>changeJob(e.target.value)} placeholder="Paste the job description here..."/><div className="smallrow"><button className="linkbtn" onClick={sample}>Try sample data</button><span>{words} words</span></div></article></section><div className="actions"><p className="hint">{msg}</p><button className="analyze" disabled={loading} onClick={run}>{loading?'Reading PDF...':'Analyze match'}</button></div>{res&&<section id="results" className="results"><div className="resulthead"><div><p className="eyebrow">Analysis result</p><h2>Your job match</h2></div><button className="reset" onClick={()=>setRes(null)}>Reset</button></div><div className="stats"><article className="stat primary"><p>Match score</p><div className="score">{res.score}<small>%</small></div><div className="meter"><span style={{width:res.score+'%'}}/></div><p className="detail">{res.score>=70?'Strong alignment with this role.':res.score>=40?'There is a solid foundation to build on.':'Add relevant evidence before applying.'}</p></article><article className="stat"><p>Match category</p><strong className={res.cat.split(' ')[0].toLowerCase()}>{res.cat}</strong><p className="detail">Based on role relevance and skill coverage</p></article><article className="stat"><p>Required skills covered</p><strong>{res.match.length} / {res.total}</strong><p className="detail">Skills identified in the job description</p></article></div><div className="skillgrid"><article className="skillcard"><div className="skillhead"><span className="badge">+</span><h3>Matched skills</h3><span className="count">{res.match.length}</span></div><Tags list={res.match}/></article><article className="skillcard"><div className="skillhead"><span className="badge warn">+</span><h3>Skills to build</h3><span className="count">{res.miss.length}</span></div><Tags list={res.miss} miss/></article><article className="recommend"><span className="bulb">!</span><p className="eyebrow">Recommendation</p><h3>{res.miss.length?'Prioritize '+res.miss.slice(0,2).join(' and ')+'.':'Your listed skills align well.'}</h3><p>{res.miss.length?'Strengthen your application by learning or showing evidence of '+res.miss.slice(0,3).join(', ')+'. Add projects, certificates, or measurable experience where appropriate.':'Tailor your resume with measurable outcomes and role-specific project highlights to make this match even stronger.'}</p></article></div></section>}</main></>};ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
